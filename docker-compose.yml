
# For development, run the following command:
#     docker compose watch
# to start the application and watch for changes in the code.
#
# Don't forget to run:
#     docker compose down
# to stop the application.

services:
  # Define the service name
  web:
     # Define the image that we want to use
    image: jonasal/nginx-certbot:latest
    container_name: acorn-nginx
    env_file:
      - ./nginx-certbot.env
    volumes:
      - ./media:/media
      - nginx_secrets:/etc/letsencrypt    # Docker managed volume (see list at the bottom)
      - ./nginx/nginx_secrets/cloudflare.ini:/etc/letsencrypt/cloudflare.ini  # Optional DNS INI file, remove if not needed
      - ./nginx/user_conf.d/nginx.conf:/etc/nginx/user_conf.d/nginx.conf  # or a host mount with a relative or full path.
    ports:
      - 443:443
    depends_on:
      - app
    networks:
      - acornnet
  app:
    # Define the name so we can reference it
    container_name: acorn-app
    networks:
      - acornnet
    # For hot deploy of code ... NOT FOR PRODUCTION!
    build: .
    develop:
      watch:
        - action: sync
          path: .
          target: /app

  # The mongodb database service
  db:
    # Define the image that we want to use
    image: mongo:latest
    # Define the name so we can reference it
    container_name: acorn-mongo
    # Define the volumes that we want to mount
    volumes:
      - acornvol:/data/db
    # Define the networks that we want to use
    networks:
      - acornnet

# Define the networks that we want to use
networks:
  acornnet:
    driver: bridge

# Define the volumes that we want to use
volumes:
  acornvol:
      driver: local
  nginx_secrets:
  user_conf.d:
